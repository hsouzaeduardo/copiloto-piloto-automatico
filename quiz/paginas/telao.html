<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telão — Quiz</title>
<style>
  :root { --roxo: #A42FFC; --navy: #001635; --navy2: #0B2347; --lav: #D9C8F5; --txt: #F4F0FB; --ok: #2BB3A8; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: var(--navy); color: var(--txt); font: 24px/1.3 "Segoe UI", system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 22px 48px; font-size: 22px; color: var(--lav); }
  header b { color: #fff; font-size: 26px; }
  main { display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; padding: 0 48px 40px; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 20px; min-height: 0; }
  h1 { font-size: 46px; margin: 0; line-height: 1.15; }
  .big { font-size: 64px; font-weight: 800; }
  .sub { color: var(--lav); }
  .card { background: var(--navy2); border-radius: 20px; padding: 24px 28px; }
  .timer { height: 14px; background: var(--navy2); border-radius: 7px; overflow: hidden; }
  .timer i { display: block; height: 100%; background: var(--roxo); transition: width 1s linear; }
  .opcao { display: flex; gap: 18px; align-items: center; background: var(--navy2); border-radius: 16px; padding: 16px 20px; border: 3px solid transparent; }
  .opcao .letra { width: 54px; height: 54px; border-radius: 50%; background: var(--roxo); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; flex: none; }
  .opcao.certa { border-color: var(--ok); background: #0f3b38; }
  .barra { height: 34px; background: #16305C; border-radius: 8px; overflow: hidden; position: relative; }
  .barra i { display: block; height: 100%; background: var(--roxo); transition: width .6s; }
  .barra.certa i { background: var(--ok); }
  .barra span { position: absolute; left: 12px; top: 0; line-height: 34px; font-weight: 700; font-size: 20px; }
  ol { margin: 0; padding-left: 36px; font-size: 28px; } li { padding: 6px 0; display: flex; justify-content: space-between; }
  li:first-child { color: var(--roxo); font-weight: 800; }
  .qr { background: #fff; border-radius: 16px; padding: 12px; width: 300px; height: 300px; display: grid; place-items: center; }
  .qr img { width: 100%; height: 100%; }
  .pulse { animation: p 1.6s infinite; } @keyframes p { 50% { opacity: .5; } }
</style>
</head>
<body>
<header><b>Do copiloto ao piloto automático · Quiz</b><span id="meta"></span></header>
<main id="app"></main>
<script>
  const $app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const url = location.origin + "/";
  let tela = "";
  function render(html, chave) { if (chave !== tela) { $app.innerHTML = html; tela = chave; } }
  const ranking = (d, n) => `<div class="card"><div class="sub">Placar</div><ol>${d.ranking.slice(0, n).map(r => `<li><span>${esc(r.nome)}</span><span>${r.pontos}</span></li>`).join("") || "<li>—</li>"}</ol></div>`;

  async function tick() {
    let d; try { d = await (await fetch("/api/estado")).json(); } catch { return; }
    document.getElementById("meta").textContent = `${d.jogadores} jogador(es)` + (d.numero ? ` · pergunta ${d.numero}/${d.total_perguntas}` : "");

    if (d.fase === "lobby") {
      render(`<div class="col"><h1>Entre no quiz pelo celular</h1><p class="sub">Aponte a câmera para o QR code ou acesse</p><div class="big" style="color:var(--roxo);word-break:break-all">${esc(url.replace(/^https?:\/\//, ""))}</div>
        <p class="sub pulse"><span id="n">${d.jogadores}</span> pessoa(s) já entraram</p></div>
        <div class="col"><div class="qr"><img src="/qr.png" alt="QR code"></div>${ranking(d, 5)}</div>`, "lobby");
      document.getElementById("n").textContent = d.jogadores;
      return;
    }
    if (d.fase === "pergunta") {
      render(`<div class="col"><p class="sub">Pergunta ${d.numero} de ${d.total_perguntas}</p><h1>${esc(d.pergunta.texto)}</h1>
        <div class="timer"><i id="barra"></i></div>
        ${d.pergunta.opcoes.map((o, i) => `<div class="opcao"><span class="letra">${"ABC"[i]}</span><span>${esc(o)}</span></div>`).join("")}</div>
        <div class="col"><div class="card"><div class="sub">Tempo</div><div class="big" id="t">${d.tempo_restante}s</div></div>
        <div class="card"><div class="sub">Respostas</div><div class="big" id="r">${d.respondidos} / ${d.jogadores}</div></div></div>`, "pergunta" + d.numero);
      document.getElementById("barra").style.width = (100 * d.tempo_restante / d.tempo_limite) + "%";
      document.getElementById("t").textContent = d.tempo_restante + "s";
      document.getElementById("r").textContent = `${d.respondidos} / ${d.jogadores}`;
      return;
    }
    if (d.fase === "revelado") {
      const total = Math.max(1, d.distribuicao.reduce((a, b) => a + b, 0));
      render(`<div class="col"><p class="sub">Pergunta ${d.numero} de ${d.total_perguntas}</p><h1>${esc(d.pergunta.texto)}</h1>
        ${d.pergunta.opcoes.map((o, i) => `<div class="opcao ${i === d.correta ? "certa" : ""}"><span class="letra">${"ABC"[i]}</span><span>${esc(o)}</span></div>
          <div class="barra ${i === d.correta ? "certa" : ""}"><i style="width:${100 * d.distribuicao[i] / total}%"></i><span>${d.distribuicao[i]} (${Math.round(100 * d.distribuicao[i] / total)}%)</span></div>`).join("")}
        <div class="card sub">${esc(d.explicacao)}</div></div>
        <div class="col">${ranking(d, 5)}</div>`, "revelado" + d.numero);
      return;
    }
    if (d.fase === "final") {
      const [a, b, c] = d.ranking;
      render(`<div class="col"><h1>Placar final</h1>
        ${a ? `<div class="card"><div class="sub">🥇 1º lugar</div><div class="big" style="color:var(--roxo)">${esc(a.nome)} · ${a.pontos}</div></div>` : ""}
        ${b ? `<div class="card"><div class="sub">🥈 2º lugar</div><div class="big">${esc(b.nome)} · ${b.pontos}</div></div>` : ""}
        ${c ? `<div class="card"><div class="sub">🥉 3º lugar</div><div class="big">${esc(c.nome)} · ${c.pontos}</div></div>` : ""}</div>
        <div class="col">${ranking(d, 10)}</div>`, "final");
    }
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
